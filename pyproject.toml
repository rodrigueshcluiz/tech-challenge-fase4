[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voc-rag"
version = "0.1.0"
description = "Voice of Customer com RAG sobre as avaliações da Olist (Tech Challenge Fase 4)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
